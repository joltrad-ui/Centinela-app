name: Publicar

# Publica la app (web/) con el barrido que ya hay. No barre nunca: tarda segundos.
# Repositorio público: nada personal aquí ni en el registro.

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/rama.sh", ".github/workflows/publicar.yml", ".github/workflows/pruebas.yml"]
  workflow_dispatch:
    inputs:
      sin_pruebas:
        description: "Publicar sin correr las pruebas (solo si fallan por algo ajeno a la app y hay que publicar ya)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  # Nada se publica si fallan las pruebas.
  pruebas:
    if: ${{ !inputs.sin_pruebas }}
    uses: ./.github/workflows/pruebas.yml

  publicar:
    needs: pruebas
    if: ${{ always() && (needs.pruebas.result == 'success' || needs.pruebas.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar la app
        env:
          REMOTO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: bash scripts/rama.sh app web
