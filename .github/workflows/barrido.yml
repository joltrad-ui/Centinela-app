name: Barrido

# Solo por horario o a mano: un push no barre nunca.
# Barre la lista base (scanner/universe.json) cada media hora en horario de mercado.
# Repositorio público: todo lo que se escribe aquí o en el registro lo puede leer cualquiera.
# Las reglas y los favoritos entran por secretos y no se publican.

on:
  schedule:
    # Horas en UTC, de lunes a viernes.
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      reemplazar:
        description: "Barrer aunque el mercado esté cerrado y sustituir el último barrido de mercado abierto"
        type: boolean
        default: false

permissions:
  contents: write

# Los barridos van de uno en uno; publicar la app no espera por ellos.
concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Barrido anterior
        run: |
          mkdir -p out
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD data 2>/dev/null | tar -x -C out || true
          fi

      - name: Barrer
        id: barrer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CENTINELA_CONFIG: ${{ secrets.CENTINELA_CONFIG }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scanner/scan.mjs --public --out out ${{ inputs.reemplazar && '--reemplazar' || '' }}

      # Con el mercado cerrado no se barre y no hay nada nuevo que guardar.
      - name: Guardar el barrido
        if: steps.barrer.outputs.saltado != '1'
        env:
          REMOTO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: bash scripts/rama.sh datos out/data
