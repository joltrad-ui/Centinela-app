name: Barrido

# Solo por horario o a mano: un push no barre nunca.
#   Lista rápida (scanner/rapida.json): cada media hora en horario de mercado.
#   Universo completo: tres veces al día.
# Repositorio público: todo lo que se escribe aquí o en el registro lo puede leer cualquiera.
# Las reglas y los favoritos entran por secretos y no se publican.

on:
  schedule:
    # Horas en UTC, de lunes a viernes.
    - cron: "7,37 13-21 * * 1-5" # lista rápida
    - cron: "45 14,19 * * 1-5" # universo completo
    - cron: "15 17 * * 1-5" # universo completo
  workflow_dispatch:
    inputs:
      lista:
        description: Qué barrer
        type: choice
        options: [rapida, completa]
        default: rapida

permissions:
  contents: write

# Los barridos van de uno en uno entre sí; publicar la app no espera por ellos.
concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Qué toca
        id: plan
        run: |
          lista=completa
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lista="${{ inputs.lista }}"
          elif [ "${{ github.event.schedule }}" = "7,37 13-21 * * 1-5" ]; then
            lista=rapida
          fi
          echo "lista=$lista" >> "$GITHUB_OUTPUT"

      - name: Barrido anterior
        run: |
          mkdir -p out
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD data 2>/dev/null | tar -x -C out || true
          fi

      - name: Barrer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CENTINELA_CONFIG: ${{ secrets.CENTINELA_CONFIG }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scanner/scan.mjs --public --out out ${{ steps.plan.outputs.lista == 'rapida' && '--lista rapida' || '' }}

      - name: Guardar el barrido
        env:
          REMOTO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: bash scripts/rama.sh datos out/data
