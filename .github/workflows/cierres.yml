name: Cierres

# Solo por horario o a mano: un push no lo lanza nunca.
# Cada mañana, antes de que abra la bolsa, baja los cierres diarios de la lista base
# (scanner/universe.json) y los deja en historia/. No barre opciones ni toca data/.
# La fuente (CBOE) publica el cierre de un día a la mañana siguiente: el 6 oct a las 07:18 UTC
# todavía no estaba el del día 5 y a las 13:52 UTC sí. Por eso dos pasadas: 12:23 y, de repuesto,
# 13:03, las dos antes de la apertura (13:30 UTC en verano, 14:30 en invierno). Si la segunda
# no trae nada nuevo, el archivo no cambia y la app no vuelve a descargarlo.
# Repositorio público: el archivo es igual para cualquiera; aquí no entra ningún secreto.

on:
  schedule:
    # Horas en UTC, de lunes a viernes.
    - cron: "23 12 * * 1-5"
    - cron: "3 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cierres
  cancel-in-progress: false

jobs:
  cierres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cierres anteriores
        run: |
          mkdir -p out
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD historia 2>/dev/null | tar -x -C out || true
          fi

      - name: Bajar cierres
        run: node scanner/cierres.mjs --out out

      - name: Guardar los cierres
        env:
          REMOTO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: bash scripts/rama.sh historia out/historia
